name: Backend

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "!backend/**/*.md"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "!backend/**/*.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --runInBand
      - run: npm run lint:portability

  deploy:
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: backend-${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_PROJECT_ID || secrets.PRODUCTION_SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ github.event_name == 'pull_request' && secrets.STAGING_SUPABASE_DB_PASSWORD || secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APP_SUPABASE_SERVICE_ROLE_KEY: ${{ github.event_name == 'pull_request' && secrets.STAGING_APP_SUPABASE_SERVICE_ROLE_KEY || secrets.PRODUCTION_APP_SUPABASE_SERVICE_ROLE_KEY }}
      BOOTSTRAP_SECRET_KEY: ${{ github.event_name == 'pull_request' && secrets.STAGING_BOOTSTRAP_SECRET_KEY || secrets.PRODUCTION_BOOTSTRAP_SECRET_KEY }}
      LLM_TIMEOUT_MS: ${{ secrets.LLM_TIMEOUT_MS || '30000' }}
      MAX_BATCH_SIZE: ${{ secrets.MAX_BATCH_SIZE || '10' }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ github.event_name == 'pull_request' && 'ai-text-enhancer-staging' || 'ai-text-enhancer-production' }}
      LANGSMITH_ENDPOINT: https://api.smith.langchain.com
      APP_ENV: ${{ github.event_name == 'pull_request' && 'staging' || 'production' }}
      APP_RELEASE: ${{ github.sha }}
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
      - name: Require deployment secrets
        run: test -n "$LANGSMITH_API_KEY"
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Sync Supabase secrets
        run: |
          supabase secrets set \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            APP_SUPABASE_SERVICE_ROLE_KEY="$APP_SUPABASE_SERVICE_ROLE_KEY" \
            BOOTSTRAP_SECRET_KEY="$BOOTSTRAP_SECRET_KEY" \
            LLM_TIMEOUT_MS="$LLM_TIMEOUT_MS" \
            MAX_BATCH_SIZE="$MAX_BATCH_SIZE" \
            LANGSMITH_TRACING="$LANGSMITH_TRACING" \
            LANGSMITH_API_KEY="$LANGSMITH_API_KEY" \
            LANGSMITH_PROJECT="$LANGSMITH_PROJECT" \
            LANGSMITH_ENDPOINT="$LANGSMITH_ENDPOINT" \
            APP_ENV="$APP_ENV" \
            APP_RELEASE="$APP_RELEASE" \
            LOG_LEVEL="$LOG_LEVEL"
      - name: Apply database migrations
        run: supabase db push --linked
      - name: Deploy Edge Functions
        run: |
          for function in enhance admin me; do
            supabase functions deploy "$function" --no-verify-jwt
          done
      - name: Remove disabled payment functions
        run: |
          deployed="$(supabase functions list --project-ref "$SUPABASE_PROJECT_ID" --output-format json)"
          for function in create-checkout stripe-webhook; do
            if jq -e --arg slug "$function" 'any(.[]; .slug == $slug)' <<< "$deployed" > /dev/null; then
              supabase functions delete "$function" --project-ref "$SUPABASE_PROJECT_ID"
            fi
          done
      - name: Verify deployment
        run: |
          base_url="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base_url/enhance/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$base_url/me/health"
