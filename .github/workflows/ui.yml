name: UI

on:
  pull_request:
    branches:
      - main
    paths:
      - "ui/**"
      - "!ui/**/*.md"
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "!ui/**/*.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
