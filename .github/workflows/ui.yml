name: UI

on:
  pull_request:
    branches:
      - main
    paths:
      - "ui/**"
      - "!ui/**/*.md"
      - "backend/src/config/models.config.ts"
      - "backend/src/config/roles.config.ts"
      - "backend/src/config/tier-limits.config.ts"
      - "backend/src/config/transformation-options.config.ts"
      - "backend/src/types/api.types.ts"
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "!ui/**/*.md"
      - "backend/src/config/models.config.ts"
      - "backend/src/config/roles.config.ts"
      - "backend/src/config/tier-limits.config.ts"
      - "backend/src/config/transformation-options.config.ts"
      - "backend/src/types/api.types.ts"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_APP_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_API_BASE_URL: https://example.supabase.co/functions/v1
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run build
