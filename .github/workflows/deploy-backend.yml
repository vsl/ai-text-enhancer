name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js for testing
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # # Run TypeScript type checking
      # - name: TypeScript type check
      #   run: npm run type-check

      # # Run Jest tests
      # - name: Run tests
      #   run: npm test
      #   env:
      #     # Use mock environment for tests
      #     # SUPABASE_URL: http://127.0.0.1:54321
      #     APP_SUPABASE_JWT_SECRET: ${{ secrets.APP_SUPABASE_JWT_SECRET }}
      #     APP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}
      #     GEMINI_API_KEY: mock_gemini_key
      #     OPENROUTER_API_KEY: mock_openrouter_key
      #     LLM_TIMEOUT_MS: 30000
      #     MAX_BATCH_SIZE: 10

      # # Check platform portability
      # - name: Platform portability check
      #   run: npm run lint:portability

      # Setup Supabase CLI
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Link to Supabase project
      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Set Supabase secrets from GitHub Secrets
      # Note: SUPABASE_URL is auto-provided by Supabase Edge Functions runtime (no need to sync)
      - name: Sync environment secrets
        run: |
          echo "🔐 Syncing secrets to Supabase..."
          supabase secrets set \
            GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            APP_SUPABASE_JWT_SECRET="${{ secrets.APP_SUPABASE_JWT_SECRET }}" \
            APP_SUPABASE_SERVICE_ROLE_KEY="${{ secrets.APP_SUPABASE_SERVICE_ROLE_KEY }}" \
            BOOTSTRAP_SECRET_KEY="${{ secrets.BOOTSTRAP_SECRET_KEY || '' }}" \
            LLM_TIMEOUT_MS="${{ secrets.LLM_TIMEOUT_MS || '30000' }}" \
            MAX_BATCH_SIZE="${{ secrets.MAX_BATCH_SIZE || '10' }}" \
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}" \
            STRIPE_WEBHOOK_SECRET="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            STRIPE_PUBLISHABLE_KEY="${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
          echo "✅ Secrets synced successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Apply database migrations
      - name: Apply database migrations
        run: |
          echo "📊 Applying database migrations..."
          supabase db push --linked
          echo "✅ Migrations applied successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Deploy Edge Functions
      - name: Deploy Edge Functions
        run: |
          echo "📦 Deploying enhance function..."
          supabase functions deploy enhance --no-verify-jwt
          echo "📦 Deploying admin function..."
          supabase functions deploy admin --no-verify-jwt
          echo "📦 Deploying me function..."
          supabase functions deploy me --no-verify-jwt
          echo "📦 Deploying create-checkout function..."
          supabase functions deploy create-checkout --no-verify-jwt
          echo "📦 Deploying stripe-webhook function..."
          supabase functions deploy stripe-webhook --no-verify-jwt
          echo "✅ All functions deployed successfully"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Get deployment info
      - name: Get function URL
        id: get-url
        run: |
          FUNCTION_URL="https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co"
          echo "function_url=$FUNCTION_URL" >> $GITHUB_OUTPUT
          echo "📍 Function deployed to: $FUNCTION_URL/functions/v1/enhance"

      # Test health endpoints
      - name: Test health endpoints
        run: |
          sleep 5  # Wait for functions to be ready
          ENHANCE_HEALTH="${{ steps.get-url.outputs.function_url }}/functions/v1/enhance/health"
          ADMIN_HEALTH="${{ steps.get-url.outputs.function_url }}/functions/v1/admin/health"
          ME_HEALTH="${{ steps.get-url.outputs.function_url }}/functions/v1/me/health"
          CHECKOUT_HEALTH="${{ steps.get-url.outputs.function_url }}/functions/v1/create-checkout/health"
          WEBHOOK_HEALTH="${{ steps.get-url.outputs.function_url }}/functions/v1/stripe-webhook/health"

          echo "🏥 Testing enhance health endpoint: $ENHANCE_HEALTH"
          curl -f "$ENHANCE_HEALTH" || echo "⚠️ Enhance health check failed (function may still be initializing)"

          echo "🏥 Testing admin health endpoint: $ADMIN_HEALTH"
          curl -f "$ADMIN_HEALTH" || echo "⚠️ Admin health check failed (function may still be initializing)"

          echo "🏥 Testing me health endpoint: $ME_HEALTH"
          curl -f "$ME_HEALTH" || echo "⚠️ Me health check failed (function may still be initializing)"

          echo "🏥 Testing create-checkout health endpoint: $CHECKOUT_HEALTH"
          curl -f "$CHECKOUT_HEALTH" || echo "⚠️ Create-checkout health check failed (function may still be initializing)"

          echo "🏥 Testing stripe-webhook health endpoint: $WEBHOOK_HEALTH"
          curl -f "$WEBHOOK_HEALTH" || echo "⚠️ Stripe-webhook health check failed (function may still be initializing)"

      # Summary
      - name: Deployment summary
        run: |
          echo "✨ Deployment complete!"
          echo ""
          echo "📍 Enhance Function: ${{ steps.get-url.outputs.function_url }}/functions/v1/enhance"
          echo "📍 Admin Function: ${{ steps.get-url.outputs.function_url }}/functions/v1/admin"
          echo "📍 Me Function: ${{ steps.get-url.outputs.function_url }}/functions/v1/me"
          echo "📍 Create Checkout: ${{ steps.get-url.outputs.function_url }}/functions/v1/create-checkout"
          echo "📍 Stripe Webhook: ${{ steps.get-url.outputs.function_url }}/functions/v1/stripe-webhook"
          echo ""
          echo "📊 View logs with: npm run logs"
          echo "🏥 Enhance health: ${{ steps.get-url.outputs.function_url }}/functions/v1/enhance/health"
          echo "🏥 Admin health: ${{ steps.get-url.outputs.function_url }}/functions/v1/admin/health"
          echo "🏥 Me health: ${{ steps.get-url.outputs.function_url }}/functions/v1/me/health"
          echo "🏥 Create-checkout health: ${{ steps.get-url.outputs.function_url }}/functions/v1/create-checkout/health"
          echo "🏥 Stripe-webhook health: ${{ steps.get-url.outputs.function_url }}/functions/v1/stripe-webhook/health"
